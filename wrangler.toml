# Example Cloudflare Wrangler configuration for Astro.js

name = "auth-web-porto"
account_id = "aad5dedf7e6b22b552cd6c1184a70710"
compatibility_date = "2026-05-19"
compatibility_flags = [ "nodejs_compat_v2" ]

[[kv_namespaces]]
binding = "prod-web-porto"
id = "76bea9b089d24d238e818a3059b511ee"

[[d1_databases]]
binding = "DB"
database_name = "prod-porto-db"
database_id = "4b4c452c-c34d-4c2c-9de8-18cdbd9b0438"
migrations_dir = "drizzle"


[[kv_namespaces]]
binding = "SESSION"
id = "e835e2e882f341a0997f1504e3acce01"